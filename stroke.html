<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>貴族長照｜中風不等人｜長者慢性病互動教學簡報</title>
<style>
:root{
  --orange:#E8552D; --amber:#F4A93C; --teal:#028090; --ink:#12343B;
  --th:#028090; --thd:#12343B;
  --bg:#FDFBF7; --card:#FFFFFF; --line:#E1D8CA;
  --navh:48px; --s:1; --hs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;}
body{overflow:hidden}
button{font-family:inherit;color:inherit}
#stage{position:absolute;left:0;right:0;top:0;bottom:var(--navh);overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden}
.slide.on{opacity:1;visibility:visible;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pad{position:absolute;inset:0;padding:1.6vh 2.2vw;display:flex;flex-direction:column;gap:.7vh;overflow:hidden}
.pad.mid{justify-content:center;align-items:center;text-align:center}

/* ---------- header ---------- */
.hd{flex:0 0 auto}
.tagrow{display:flex;align-items:center;gap:calc(11px*var(--hs));margin-bottom:calc(3px*var(--hs))}
.tag{background:var(--th);color:#fff;border-radius:999px;padding:calc(4px*var(--hs)) calc(15px*var(--hs));
  font-size:calc(17px*var(--hs));font-weight:800;letter-spacing:.06em;white-space:nowrap}
.rule{flex:1;height:calc(4px*var(--hs));background:var(--th);opacity:.2;border-radius:99px}
h1.t{margin:0;font-size:calc(43px*var(--hs));line-height:1.22;font-weight:900;letter-spacing:.01em}
.lead{margin:calc(2px*var(--hs)) 0 0;font-size:calc(21px*var(--hs));line-height:1.25;color:#54666b;font-weight:700}
.src{flex:0 0 auto;font-size:calc(13px*var(--s));color:#9aa3a6;line-height:1.25;padding-top:.1vh}

/* ---------- flow layout: rows of equal tiles, column count chosen per slide ---------- */
.flow{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.8vh;--g:.9vw;--c:2}
.frow{flex:1 1 0;min-height:0;display:flex;justify-content:center;gap:var(--g)}
.frow>*{flex:0 0 auto;width:calc((100% - (var(--c) - 1)*var(--g))/var(--c));min-width:0;min-height:0}
.card .v,.stat .d,.sc .tx,.pi .tx,.pl .tx,.opt .tx,.oi .tx,.rf .v,.task .v{text-wrap:balance}

/* ---------- generic body ---------- */
.body{flex:1 1 auto;min-height:0;display:grid;gap:.8vh .9vw;grid-auto-rows:minmax(0,1fr)}
.c2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c22{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.card{background:var(--card);border:calc(3px*var(--s)) solid var(--line);border-radius:calc(16px*var(--s));
  padding:calc(9px*var(--s)) calc(15px*var(--s));display:flex;flex-direction:column;justify-content:center;
  gap:calc(2px*var(--s));min-height:0;overflow:hidden}
.card .k{font-size:calc(28px*var(--s)*var(--cs,1));font-weight:900;color:var(--th);line-height:1.22}
.card .v{font-size:calc(33px*var(--s)*var(--cs,1));line-height:1.34;font-weight:700}
.card .v b{color:var(--orange)}
.core .card{border-color:var(--th);background:#fff}

/* ---------- cover ---------- */
.cover{background:linear-gradient(150deg,var(--th) 0%,var(--thd) 100%);color:#fff}
.cover .ct{font-size:calc(90px*var(--s));font-weight:900;line-height:1.16;letter-spacing:.02em;margin:0}
.cover .cs{font-size:calc(36px*var(--s));font-weight:700;margin:calc(20px*var(--s)) 0 0;opacity:.95;line-height:1.35}
.cover .cd{width:calc(120px*var(--s));height:calc(8px*var(--s));background:var(--amber);border-radius:99px;margin:calc(26px*var(--s)) 0}
.cover .cm{font-size:calc(25px*var(--s));font-weight:700;opacity:.88}
.cover .cdis{font-size:calc(23px*var(--s));opacity:.78;margin-top:calc(6px*var(--s))}

/* ---------- section ---------- */
.sect{background:var(--th);color:#fff}
.sect .sn{font-size:calc(31px*var(--s));font-weight:900;background:rgba(255,255,255,.2);
  padding:calc(8px*var(--s)) calc(26px*var(--s));border-radius:99px;display:inline-block}
.sect .sh{font-size:calc(72px*var(--s));font-weight:900;margin:calc(24px*var(--s)) 0 0;line-height:1.2}
.sect .sl{font-size:calc(33px*var(--s));margin:calc(18px*var(--s)) 0 0;opacity:.95;line-height:1.35;font-weight:700;max-width:82%}

/* ---------- stats ---------- */
.stat{background:var(--card);border:calc(3px*var(--s)) solid var(--line);border-radius:calc(18px*var(--s));
  padding:calc(10px*var(--s));display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:calc(2px*var(--s));text-align:center;min-height:0;overflow:hidden;border-top:calc(10px*var(--s)) solid var(--th)}
.stat .n{font-size:calc(66px*var(--s)*var(--cs,1));font-weight:900;color:var(--th);line-height:1.18;letter-spacing:-.01em}
.stat .u{font-size:calc(24px*var(--s)*var(--cs,1));font-weight:800;color:var(--orange)}
.stat .d{font-size:calc(32px*var(--s)*var(--cs,1));font-weight:700;line-height:1.28;color:#2c3b40}

/* ---------- choice ---------- */
.q{flex:0 0 auto;background:#fff;border:calc(3px*var(--s)) dashed var(--th);border-radius:calc(14px*var(--s));
  padding:calc(11px*var(--s)) calc(20px*var(--s));font-size:calc(34px*var(--s));font-weight:800;line-height:1.3}
.opts{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.85vh}
.opt{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:calc(14px*var(--s));cursor:pointer;
  background:#fff;border:calc(3px*var(--s)) solid var(--line);border-radius:calc(14px*var(--s));
  padding:calc(6px*var(--s)) calc(17px*var(--s));text-align:left;font-size:calc(36px*var(--s)*var(--cs,1));font-weight:700;line-height:1.25}
.opt .ch{flex:0 0 auto;width:calc(50px*var(--s)*var(--cs,1));height:calc(50px*var(--s)*var(--cs,1));border-radius:50%;
  background:var(--th);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:calc(28px*var(--s)*var(--cs,1));font-weight:900}
.opt .mk{flex:0 0 auto;margin-left:auto;font-size:calc(36px*var(--s)*var(--cs,1));width:calc(46px*var(--s)*var(--cs,1));text-align:center;display:inline-block}
.opt:hover{border-color:var(--th)}
.opt.right{border-color:#1e8449;background:#eafaf1}
.opt.wrong{border-color:#c0392b;background:#fdecea}
.done .opt{cursor:default}

/* ---------- fill ---------- */
.bank{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:calc(9px*var(--s));justify-content:center}
.word{background:var(--amber);color:#3b2a10;border:none;border-radius:calc(12px*var(--s));
  padding:calc(8px*var(--s)) calc(20px*var(--s));font-size:calc(31px*var(--s));font-weight:900;cursor:pointer}
.word.sel{background:var(--orange);color:#fff;box-shadow:0 0 0 calc(4px*var(--s)) rgba(232,85,45,.3)}
.word.used{opacity:.3;cursor:default}
.blanks{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.9vh}
.bl{flex:1 1 0;min-height:0;display:flex;align-items:center;overflow:hidden;font-size:calc(37px*var(--s)*var(--cs,1));font-weight:700;line-height:1.35;background:#fff;
  border:calc(3px*var(--s)) solid var(--line);border-radius:calc(14px*var(--s));
  padding:calc(10px*var(--s)) calc(18px*var(--s))}
.bl .in{width:100%}
.slot{display:inline-block;white-space:nowrap;min-width:var(--bw);text-align:center;border-bottom:calc(4px*var(--s)) solid var(--th);
  color:var(--orange);font-weight:900;cursor:pointer;padding:0 calc(6px*var(--s));margin:0 calc(3px*var(--s))}
.slot.empty{color:#c8cfd1}
.bl.right{border-color:#1e8449;background:#eafaf1}
.bl.wrong{border-color:#c0392b;background:#fdecea}

/* ---------- order ---------- */
.ord{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:.85vh}
.oi{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:calc(14px*var(--s));cursor:pointer;
  background:#fff;border:calc(3px*var(--s)) solid var(--line);border-radius:calc(14px*var(--s));
  padding:calc(6px*var(--s)) calc(17px*var(--s));text-align:left;font-size:calc(34px*var(--s)*var(--cs,1));font-weight:700;line-height:1.25}
.oi .num{flex:0 0 auto;width:calc(54px*var(--s)*var(--cs,1));height:calc(54px*var(--s)*var(--cs,1));border-radius:calc(12px*var(--s));
  background:#EFEAE2;color:#9aa4a8;display:flex;align-items:center;justify-content:center;
  font-size:calc(30px*var(--s)*var(--cs,1));font-weight:900}
.oi.picked .num{background:var(--th);color:#fff}
.oi.right{border-color:#1e8449;background:#eafaf1}
.oi.wrong{border-color:#c0392b;background:#fdecea}

/* ---------- spot ---------- */
.cards{flex:1 1 auto;min-height:0;display:grid;gap:.9vh .85vw;grid-auto-rows:minmax(0,1fr)}
.g8{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.g9{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
.sc{position:relative;background:#fff;border:calc(3px*var(--s)) solid var(--line);border-radius:calc(16px*var(--s));
  padding:calc(18px*var(--s)) calc(12px*var(--s));display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:calc(37px*var(--s)*var(--cs,1));font-weight:800;line-height:1.25;cursor:pointer;min-height:0;overflow:hidden}
.sc .no{position:absolute;top:calc(4px*var(--s));left:calc(9px*var(--s));font-size:calc(18px*var(--s));
  color:#b6bec1;font-weight:900}
.sc .bd{position:absolute;bottom:calc(4px*var(--s));right:calc(9px*var(--s));font-size:calc(19px*var(--s));font-weight:900;display:inline-block}
.sc.bad{border-color:#c0392b;background:#fdecea}
.sc.bad .bd{color:#c0392b}
.sc.good{border-color:#1b7fa8;background:#eaf4fb}
.sc.good .bd{color:#1b7fa8}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.exbar{position:relative;flex:0 0 auto;background:#fff;border:calc(3px*var(--s)) solid var(--th);
  border-radius:calc(14px*var(--s));padding:calc(10px*var(--s)) calc(18px*var(--s))}
.exg{visibility:hidden;font-size:calc(29px*var(--s));font-weight:700;line-height:1.3}
.exl{position:absolute;inset:calc(10px*var(--s)) calc(18px*var(--s));display:flex;align-items:center;
  font-size:calc(29px*var(--s));font-weight:700;line-height:1.3}

/* ---------- sort ---------- */
.pool{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:.85vh .85vw}
.pi{position:relative;background:#fff;border:calc(3px*var(--s)) solid var(--line);border-radius:calc(14px*var(--s));
  padding:calc(16px*var(--s)) calc(10px*var(--s));display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:calc(33px*var(--s)*var(--cs,1));font-weight:800;line-height:1.25;cursor:pointer;min-height:0;overflow:hidden}
.pi.sel{border-color:var(--orange);box-shadow:0 0 0 calc(4px*var(--s)) rgba(232,85,45,.24)}
.pi .pb{position:absolute;top:calc(4px*var(--s));right:calc(7px*var(--s));font-size:calc(19px*var(--s));
  font-weight:900;color:#fff;background:var(--th);border-radius:99px;padding:calc(1px*var(--s)) calc(9px*var(--s));
  min-width:calc(28px*var(--s));text-align:center}
.pi .pb.off{background:transparent;color:transparent}
.pi.right{border-color:#1e8449;background:#eafaf1}
.pi.wrong{border-color:#c0392b;background:#fdecea}
.bins{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.85vw}
.bin{background:var(--th);color:#fff;border:none;border-radius:calc(14px*var(--s));
  padding:calc(11px*var(--s));font-size:calc(30px*var(--s));font-weight:900;cursor:pointer;line-height:1.2}
.bin.sel{outline:calc(5px*var(--s)) solid var(--amber)}

/* ---------- movie ---------- */
.mv{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);gap:1vw}
.mvL,.mvR{display:flex;flex-direction:column;gap:.85vh;min-height:0}
.task{flex:1 1 0;min-height:0;background:#fff;border:calc(3px*var(--s)) solid var(--line);border-left:calc(10px*var(--s)) solid var(--amber);
  border-radius:calc(12px*var(--s));padding:calc(8px*var(--s)) calc(14px*var(--s));display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.task .k{font-size:calc(19px*var(--s)*var(--cs,1));font-weight:900;color:var(--orange)}
.task .v{font-size:calc(30px*var(--s)*var(--cs,1));font-weight:700;line-height:1.3}
.clip{flex:1 1 0;min-height:0;overflow:hidden;display:flex;align-items:center;gap:.5em;background:var(--ink);color:#fff;
  border:none;border-radius:calc(12px*var(--s));padding:calc(6px*var(--s)) calc(12px*var(--s));
  font-size:calc(23px*var(--s)*var(--cs,1));font-weight:800;cursor:pointer;text-align:left;line-height:1.2}
.clip .plyb{flex:0 0 auto;width:1.5em;height:1.5em;border-radius:50%;background:#E62117;
  display:flex;align-items:center;justify-content:center;font-size:.9em}
.vote{flex:0 0 auto;display:flex;flex-direction:column;background:#fff;border:calc(3px*var(--s)) dashed var(--th);border-radius:calc(12px*var(--s));
  padding:calc(7px*var(--s)) calc(14px*var(--s)) calc(9px*var(--s))}
.vote .vq{flex:0 0 auto;font-size:calc(23px*var(--s));font-weight:900;margin-bottom:calc(4px*var(--s))}
.vrow{flex:0 0 auto;display:flex;align-items:center;gap:.4em;width:100%;background:#F7F3EC;border:none;
  border-radius:calc(9px*var(--s));padding:calc(6px*var(--s)) calc(13px*var(--s));margin-top:calc(5px*var(--s));
  font-size:calc(28px*var(--s));font-weight:700;cursor:pointer;text-align:left;line-height:1.2}
.vrow .cnt{margin-left:auto;background:var(--th);color:#fff;border-radius:99px;min-width:1.6em;
  text-align:center;font-weight:900;padding:0 .3em;line-height:1.3}

/* ---------- reflect / pledge ---------- */
.rf{background:#fff;border:calc(3px*var(--s)) solid var(--line);border-left:calc(12px*var(--s)) solid var(--th);
  border-radius:calc(14px*var(--s));padding:calc(12px*var(--s)) calc(18px*var(--s));display:flex;flex-direction:column;
  justify-content:center;gap:calc(4px*var(--s));min-height:0;overflow:hidden}
.rf .k{font-size:calc(28px*var(--s)*var(--cs,1));font-weight:900;color:var(--th)}
.rf .v{font-size:calc(30px*var(--s)*var(--cs,1));font-weight:700;line-height:1.35}
.pl{position:relative;background:#fff;border:calc(3px*var(--s)) solid var(--line);border-radius:calc(14px*var(--s));
  padding:calc(8px*var(--s)) calc(16px*var(--s)) calc(8px*var(--s)) calc(56px*var(--s));
  display:flex;align-items:center;font-size:calc(31px*var(--s)*var(--cs,1));font-weight:700;line-height:1.25;
  cursor:pointer;min-height:0;overflow:hidden;text-align:left}
.pl .bx{position:absolute;left:calc(13px*var(--s));width:calc(32px*var(--s));height:calc(32px*var(--s));
  border:calc(3px*var(--s)) solid var(--th);border-radius:calc(7px*var(--s));display:flex;align-items:center;
  justify-content:center;font-size:calc(22px*var(--s));line-height:1;overflow:hidden;color:#fff}
.pl.on{border-color:var(--th);background:#f2fbfa}
.pl.on .bx{background:var(--th)}

/* ---------- score ---------- */
.scw{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(12px*var(--s))}
.scw .big{font-size:calc(130px*var(--s));font-weight:900;color:var(--th);line-height:1.15}
.scw .sub{font-size:calc(34px*var(--s));font-weight:800}
.scw .stars{font-size:calc(46px*var(--s));letter-spacing:.06em;line-height:1.25;max-width:82vw}
.scw .stars i{font-style:normal;display:inline-block;opacity:0;animation:pin .4s both}
@keyframes pin{from{opacity:0;transform:scale(0) rotate(-40deg)}to{opacity:1;transform:none}}
.scw .msg{font-size:calc(30px*var(--s));font-weight:700;color:#4a5b60;line-height:1.4;max-width:74vw}
#cfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

/* ---------- entrance animation ---------- */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.rise{animation:rise .40s var(--d,0ms) both cubic-bezier(.2,.8,.3,1)}
@keyframes popin{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.opt.right .mk,.opt.wrong .mk,.sc.bad .bd,.sc.good .bd{animation:popin .32s cubic-bezier(.2,.9,.3,1.5)}
@keyframes gpulse{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
.opt.right,.oi.right,.pi.right,.bl.right{animation:gpulse .5s}
.opt.wrong{animation:sh .4s}

html.noanim *{animation:none!important;transition:none!important}

/* ---------- nav ---------- */
#nav{position:absolute;left:0;right:0;bottom:0;height:var(--navh);background:var(--ink);color:#fff;
  display:flex;align-items:center;gap:8px;padding:0 12px;font-size:15px;font-weight:700;z-index:40}
#nav button,#nav a{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:8px;padding:7px 12px;
  font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.2}
#nav button:hover,#nav a:hover{background:rgba(255,255,255,.26)}
#nav a#bhome{background:var(--amber);color:#3b2a10}
#pg{font-size:16px;font-weight:900;min-width:80px;text-align:center}
#sctr{background:var(--amber);color:#3b2a10;border-radius:99px;padding:4px 13px;font-weight:900}
@keyframes bump{0%,100%{transform:scale(1)}40%{transform:scale(1.3)}}
#sctr.bump{animation:bump .5s}
.spacer{flex:1}
#tmr{display:none;background:var(--orange);border-radius:99px;padding:4px 14px;font-weight:900}
#tmr.on{display:block}
.fly{position:fixed;z-index:70;font-size:38px;font-weight:900;color:#F4A93C;pointer-events:none;
  text-shadow:0 2px 10px rgba(0,0,0,.4);animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{opacity:0;transform:translateY(0) scale(.5)}18%{opacity:1;transform:translateY(-16px) scale(1.2)}
  100%{opacity:0;transform:translateY(-96px) scale(1)}}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;background:rgba(18,52,59,.74);display:none;z-index:50;
  align-items:center;justify-content:center;padding:4vh 4vw}
.ov.on{display:flex}
#ansv .box{background:#fff;border-radius:24px;max-width:min(900px,88vw);width:100%;padding:30px 38px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.34);animation:pop .34s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{0%{transform:scale(.85);opacity:0}62%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
#ansv .ic{font-size:74px;line-height:1}
#ansv .ti{font-size:42px;font-weight:900;margin:4px 0 14px}
#ansv .fb{border:3px dashed var(--th);border-radius:14px;padding:16px 20px;font-size:29px;font-weight:700;
  line-height:1.45;text-align:left}
#ansv .ok{margin-top:20px;background:var(--th);color:#fff;border:none;border-radius:12px;padding:13px 38px;
  font-size:25px;font-weight:900;cursor:pointer}
#tocv .box{background:#fff;border-radius:20px;max-width:min(1180px,92vw);width:100%;max-height:88vh;overflow:auto;padding:22px}
#tocv h3{margin:0 0 12px;font-size:23px}
#tocg{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
#tocg button{text-align:left;background:#F7F3EC;border:2px solid var(--line);border-radius:11px;padding:9px 11px;
  font-size:16px;font-weight:700;cursor:pointer;line-height:1.3}
#tocg button.cur{border-color:var(--th);background:#fff}
#tocg .ix{color:var(--th);font-weight:900;margin-right:6px}

function shade(hex,d){
  var n=parseInt(hex.slice(1),16), r=(n>>16)+d, g=((n>>8)&255)+d, b=(n&255)+d;
  function c(x){return Math.max(0,Math.min(255,x));}
  return '#'+((1<<24)+(c(r)<<16)+(c(g)<<8)+c(b)).toString(16).slice(1);
}
function el(tag,cls,html){var e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}

/* ---------- sound (WebAudio, no files, works offline) ---------- */
var AC=null, SND=true;
function actx(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function tone(f,t0,dur,type,vol,to){
  if(!SND) return; var c=actx(); if(!c) return;
  var t=c.currentTime+t0;
  var o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.16,t+0.014);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t+dur+0.03);
}

/* ---------- flow layout helpers ---------- */
function flow(nodes,extra){ var f=el('div','flow'+(extra?' '+extra:'')); f.dataset.n=nodes.length; f._items=nodes; layout(f,candidates(nodes.length)[0]); return f; }
function layout(f,c){
  f.innerHTML=''; f.style.setProperty('--c',c); f.dataset.c=c;
  var it=f._items;
  for(var i=0;i<it.length;i+=c){ var row=el('div','frow'); for(var j=i;j<Math.min(i+c,it.length);j++) row.appendChild(it[j]); f.appendChild(row); }
}
function candidates(n){ return ({3:[3,1],4:[2,4],6:[3,2],8:[4,2,3],9:[3,5]})[n]||[Math.min(n,3)]; }

/* ---------- confetti ---------- */
function confetti(cv){
  var r=cv.parentNode.getBoundingClientRect();
  cv.width=r.width; cv.height=r.height;
  var g=cv.getContext('2d'), cols=['#E8552D','#F4A93C','#028090','#7B4EA3','#2E7D52'], ps=[];
  for(var i=0;i<110;i++) ps.push({x:Math.random()*r.width,y:-Math.random()*r.height,
    w:6+Math.random()*8,h:9+Math.random()*11,v:1.6+Math.random()*3.2,a:Math.random()*6.3,
    s:(Math.random()-.5)*.22,c:cols[i%cols.length]});
  var t0=Date.now();
  (function loop(){
    var el=Date.now()-t0;
    g.clearRect(0,0,cv.width,cv.height);
    ps.forEach(function(p){
      p.y+=p.v; p.a+=p.s; p.x+=Math.sin(p.a)*.8;
      g.save(); g.translate(p.x,p.y); g.rotate(p.a);
      g.fillStyle=p.c; g.globalAlpha=Math.max(0,1-el/3400);
      g.fillRect(-p.w/2,-p.h/2,p.w,p.h); g.restore();
    });
    if(el<3400) requestAnimationFrame(loop); else g.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ---------- fit ---------- */
/* Overflow is judged by geometry, not by scrollHeight: every child box must sit inside its parent's
   box (the page's content box for the page itself). scrollHeight differs between browsers (Safari counts
   glyph and letter-spacing overhang); getBoundingClientRect does not. scrollWidth is still used, with a
   small font-relative tolerance, to catch a number or word too wide to wrap. */
var ABS=(typeof WeakMap==='function')?new WeakMap():null;
function isAbs(c){
  var v=ABS?ABS.get(c):undefined;
  if(v===undefined){ var p=getComputedStyle(c).position; v=(p==='absolute'||p==='fixed'); if(ABS) ABS.set(c,v); }
  return v;
}
function hasBox(n){ return n.clientWidth>0||n.clientHeight>0; }
var LASTBLOCK='';
function badBox(n,contentBox){
  if(n.scrollWidth>n.clientWidth+Math.max(4,0.06*(parseFloat(getComputedStyle(n).fontSize)||16))){
    LASTBLOCK=n.className+' width '+n.scrollWidth+'/'+n.clientWidth; return true; }
  var r=n.getBoundingClientRect(), t=r.top, b=r.bottom, l=r.left, rt=r.right;
  var cs=getComputedStyle(n);
  t+=parseFloat(cs.paddingTop)+parseFloat(cs.borderTopWidth); b-=parseFloat(cs.paddingBottom)+parseFloat(cs.borderBottomWidth);
  l+=parseFloat(cs.paddingLeft)+parseFloat(cs.borderLeftWidth); rt-=parseFloat(cs.paddingRight)+parseFloat(cs.borderRightWidth);
  var k=n.children;
  for(var j=0;j<k.length;j++){
    var c=k[j]; if(!hasBox(c)||isAbs(c)) continue;
    var kr=c.getBoundingClientRect();
    if(kr.top<t-3||kr.bottom>b+3||kr.left<l-3||kr.right>rt+3){
      LASTBLOCK=(n.className||n.tagName)+' > '+(c.className||c.tagName)+' '+Math.round(kr.top-t)+'/'+Math.round(kr.bottom-b); return true; }
  }
  return false;
}
function overflow(root){
  if(badBox(root,true)) return true;
  var ns=root.querySelectorAll('*');
  for(var i=0;i<ns.length;i++){ var n=ns[i]; if(!hasBox(n)) continue; if(badBox(n,false)) return true; }
  return false;
}
var BOXSEL='.card,.stat,.sc,.pi,.opt,.oi,.rf,.pl,.task,.bl,.clip';
function boxOver(n){
  if(badBox(n,false)) return true;
  var ds=n.querySelectorAll('*');
  for(var j=0;j<ds.length;j++){ var d=ds[j]; if(!hasBox(d)) continue; if(badBox(d,false)) return true; }
  return false;
}
/* each box is a fixed slot from the grid, so its own text can grow to fill it
   without moving anything else — this is what kills the leftover white space */
function fitBoxes(e){
  var ns=e.querySelectorAll(BOXSEL);
  Array.prototype.forEach.call(ns,function(n){
    n.style.removeProperty('--cs');
    var top=2.6, cs=top, best=0;
    for(;cs>=1.0;cs-=0.15){                 /* coarse, from the top */
      n.style.setProperty('--cs',cs.toFixed(3));
      if(!boxOver(n)){ best=cs; break; }
    }
    if(!best){ n.style.removeProperty('--cs'); return; }
    var probe=[best+0.1,best+0.05];          /* fine, just above the coarse hit */
    for(var q=0;q<probe.length;q++){
      if(probe[q]>top) continue;
      n.style.setProperty('--cs',probe[q].toFixed(3));
      if(!boxOver(n)){ best=probe[q]; break; }
    }
    n.style.setProperty('--cs',best.toFixed(3));
  });

/* layout score: smallest text wins, but a layout that leaves the boxes half-empty loses points */
function layoutScore(e){
  var m=1e9, used=0, tot=0, maxLines=1;
  Array.prototype.forEach.call(e.querySelectorAll(BOXSEL),function(n){
    var tx=n.querySelector('.v,.d,.tx')||n;
    var cs=getComputedStyle(tx), v=parseFloat(cs.fontSize); if(v<m) m=v;
    var lh=parseFloat(cs.lineHeight)||v*1.3, ln=Math.round(tx.getBoundingClientRect().height/lh);
    if(ln>maxLines) maxLines=ln;
    var r=n.getBoundingClientRect(), top=1e9, bot=-1e9, k=n.children, any=false;
    for(var j=0;j<k.length;j++){ if(getComputedStyle(k[j]).position==='absolute') continue;
      var kr=k[j].getBoundingClientRect(); if(kr.top<top) top=kr.top; if(kr.bottom>bot) bot=kr.bottom; any=true; }
    if(any){ used+=bot-top; tot+=r.height; }
  });
  if(m===1e9) return 0;
  var fill=tot?used/tot:1;
  var read = maxLines>=7 ? 0.62 : maxLines>=5 ? 0.8 : maxLines>=4 ? 0.78 : 1;   /* narrow columns read badly */
  return m*(0.6+0.4*fill)*read;
}
/* headings scale with the screen too, but stay capped so they never starve the body text */
function hsCap(){ return 1.16*Math.max(1, stage.clientHeight/720); }
function setS(e,v){ e.style.setProperty('--s',String(v)); e.style.setProperty('--hs',String(Math.min(v,hsCap()))); }
function gfit(e,pad){
  var base=stage.clientHeight/720;                      /* 1.0 at a 720p projector */
  function at(v){ setS(e,v); return !overflow(pad); }
  var s=Math.min(4.0, 1.2+1.5*base), lo=0, floor=Math.max(0.6, 1.0*base);
  for(;s>0.5;s-=0.1){ if(at(s)){ lo=s; break; } }         /* scan from the top: finds 2-line fits a binary search would skip */
  if(lo && at(lo+0.05)) lo+=0.05;
  if(!lo || lo<floor){ lo=Math.max(lo,floor); }          /* never show a page tiny because measuring failed */
  setS(e,lo);
}
function fit(i){
  var e=els[i], pad=e.querySelector('.pad');
  Array.prototype.forEach.call(e.querySelectorAll('.rise'),function(n){ n.classList.remove('rise'); });
  Array.prototype.forEach.call(e.querySelectorAll(BOXSEL),function(n){ n.style.removeProperty('--cs'); });

    var cands=candidates(+f.dataset.n), best=-1, bestC=cands[0];

    }

  fitBoxes(e);

  clearTimeout(pre);
  var i=0;
  (function step(){
    while(i<els.length && els[i].dataset.fit) i++;
    if(i>=els.length) return;
    if(!els[i].refresh) fit(i);
    else els[i].dataset.fit='1';
    i++; pre=setTimeout(step,80);
  })();
}
sctr.textContent='⭐ 0 / '+TOTAL;
show(0);
setTimeout(prefit,400);
window.__deck={ check:function(i){ var e=els[i==null?cur:i]; var o=overflow(e.querySelector('.pad')); return o?LASTBLOCK:''; },
  get cur(){return cur;}, get score(){return score;}, total:TOTAL, show:show, slides:S, els:els, fit:fit,
  mute:function(){ SND=false; },
  setAnim:function(v){ NOANIM=!v; document.documentElement.classList.toggle('noanim',NOANIM); if(NOANIM){ els.forEach(function(e){
    Array.prototype.forEach.call(e.querySelectorAll('.rise'),function(n){ n.classList.remove('rise'); }); }); } } };
})();
</script>
</body>
